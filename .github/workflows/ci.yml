# CI gate — typecheck + tests on every push to main + every PR.
#
# Phase 1 keeps it simple: typecheck first (fast feedback), then test.
# Add lint + Playwright e2e later when there's a deploy target.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yge/db exec prisma generate

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Run unit tests
        run: pnpm -r test --if-present
        env:
          NODE_ENV: test
