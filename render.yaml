# Render Blueprint for the YGE API service.
#
# After Render creates the service:
#   1. Set ANTHROPIC_API_KEY (sync: false) in the service's
#      Environment tab.
#   2. Set DATABASE_URL to the Supabase pooled connection.
#   3. Set the auth secrets (NEXTAUTH_SECRET, MOBILE_TOKEN_SECRET).
#   4. Set the Microsoft OAuth secrets if SSO is wanted at launch.

services:
  - type: web
    name: yge-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @yge/db exec prisma generate && pnpm --filter @yge/db exec prisma migrate deploy && pnpm --filter @yge/api build
    startCommand: pnpm --filter @yge/api start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: yge-api-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUILD_SHA
        fromCommitSha: true
      - key: API_PORT
        value: "10000"
      - key: DEFAULT_COMPANY_ID
        value: yge-root
      # Default file-store data dir lives on the persistent disk so
      # restart-day doesn't wipe seeded customers / drafts / RFIs.
      # Stores that have been migrated to Postgres (master-profile,
      # vendors) ignore these env vars.
      - key: DATA_DIR
        value: /var/data
      - key: VENDORS_DATA_DIR
        value: /var/data/vendors
      - key: CUSTOMERS_DATA_DIR
        value: /var/data/customers
      - key: JOBS_DATA_DIR
        value: /var/data/jobs
      - key: ESTIMATES_DATA_DIR
        value: /var/data/estimates
      - key: DRAFTS_DATA_DIR
        value: /var/data/drafts
      - key: BID_RESULTS_DATA_DIR
        value: /var/data/bid-results
      - key: BID_TABS_DATA_DIR
        value: /var/data/bid-tabs
      - key: IMPORTED_ESTIMATES_DATA_DIR
