<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YGE Form Filler</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        font-size: 13px;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #1d4ed8;
      }
      p {
        margin: 8px 0;
        line-height: 1.45;
      }
      .pill {
        display: inline-block;
        background: #fef3c7;
        color: #92400e;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }
      a {
        color: #1d4ed8;
      }
      .field-count {
        margin-top: 12px;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
    </style>
  </head>
  <body>
    <h1>YGE Form Filler <span class="pill">Stub v0.0.1</span></h1>
    <p>
      Scaffolded extension. Auto-fill from YGE master profile lands in a
      future bundle.
    </p>
    <p>Configured API:</p>
    <div class="field-count" id="api-url">loading…</div>
    <p>Fields seen on this page:</p>
    <div class="field-count" id="field-count">—</div>
    <p style="font-size: 11px; color: #6b7280; margin-top: 16px">
      Pairs with the
      <a href="https://app.youngge.com/pdf-forms" target="_blank"
        >/pdf-forms</a
      >
      mapping library inside the YGE app.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
