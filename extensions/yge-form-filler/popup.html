<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YGE Form Filler</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        font-size: 13px;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #1d4ed8;
      }
      p {
        margin: 8px 0;
        line-height: 1.45;
      }
      .pill {
        display: inline-block;
        background: #fef3c7;
        color: #92400e;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }
      a {
        color: #1d4ed8;
      }
      .info {
        margin-top: 12px;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
      }
      button.primary {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        background: #1d4ed8;
        color: white;
        border: 0;
        border-radius: 6px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      .status {
        margin-top: 8px;
        font-size: 11px;
      }
      .status.ok {
        color: #065f46;
      }
      .status.err {
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <h1>YGE Form Filler</h1>
    <p>Configured API:</p>
    <div class="info" id="api-url">loading…</div>
    <p>This page:</p>
    <div class="info" id="field-summary">scanning…</div>
    <button class="primary" id="fill-btn" disabled>Fill matched fields</button>
    <div class="status" id="status"></div>
    <p style="font-size: 11px; color: #6b7280; margin-top: 16px">
      Pairs with the
      <a href="https://app.youngge.com/pdf-forms" target="_blank"
        >/pdf-forms</a
      >
      mapping library inside the YGE app. Snapshot cached 15 minutes.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
