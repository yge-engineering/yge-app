<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YGE Form Filler</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        width: 340px;
        font-size: 13px;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #1d4ed8;
      }
      p {
        margin: 8px 0;
        line-height: 1.45;
      }
      a {
        color: #1d4ed8;
      }
      .info {
        margin-top: 6px;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }
      button.primary {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        background: #1d4ed8;
        color: white;
        border: 0;
        border-radius: 6px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      .status {
        margin-top: 8px;
        font-size: 11px;
      }
      .status.ok {
        color: #065f46;
      }
      .status.err {
        color: #991b1b;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-top: 8px;
      }
      .row > .label {
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .row > .toggle-link {
        font-size: 11px;
        color: #1d4ed8;
        cursor: pointer;
        text-decoration: underline;
        background: none;
        border: 0;
        padding: 0;
      }
      .config {
        display: none;
        margin-top: 8px;
      }
      .config.open {
        display: block;
      }
      .config input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        box-sizing: border-box;
      }
      .config button {
        margin-top: 6px;
        padding: 6px 10px;
        background: #1d4ed8;
        color: white;
        border: 0;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>YGE Form Filler</h1>

    <div class="row">
      <span class="label">Configured API</span>
      <button class="toggle-link" id="config-toggle">edit</button>
    </div>
    <div class="info" id="api-url">loading…</div>
    <div class="config" id="config-panel">
      <input type="text" id="api-url-input" placeholder="https://api.youngge.com" />
      <button id="api-url-save">Save</button>
      <button id="api-url-reset" style="background: #6b7280; margin-left: 6px">
        Reset
      </button>
    </div>

    <div class="row">
      <span class="label">This page</span>
    </div>
    <div class="info" id="field-summary">scanning…</div>

    <button class="primary" id="fill-btn" disabled>Fill matched fields</button>
    <button
      id="undo-btn"
      style="
        display: none;
        margin-top: 8px;
        width: 100%;
        padding: 8px;
        background: white;
        color: #1d4ed8;
        border: 1px solid #1d4ed8;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      "
    >
      Undo last fill
    </button>
    <button
      id="refresh-snapshot-btn"
      style="
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        background: transparent;
        color: #6b7280;
        border: 0;
        font-size: 11px;
        cursor: pointer;
      "
    >
      Refresh snapshot
    </button>
    <div class="status" id="status"></div>

    <p style="font-size: 11px; color: #6b7280; margin-top: 16px">
      Filled values come from the
      <a href="#" id="profile-link" target="_blank">master profile</a>.
      To change a value (CSLB renewed, address moved, new VP), edit
      there and click "Refresh snapshot" in this popup.
      <a href="#" id="forms-link" target="_blank">PDF form library →</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
